# Airbnb clone — full-stack local + production deploy
# Usage:
#   docker compose up --build
#   open http://localhost:3000

services:
  backend:
    build:
      context: ./backend
    container_name: airbnb-backend
    environment:
      SQLITE_DB_PATH: /data/roamly.db
      CORS_ORIGINS: "*"
    volumes:
      - airbnb-data:/data
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        FASTAPI_URL: http://backend:8001
    container_name: airbnb-frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      FASTAPI_URL: http://backend:8001
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      CORS_ORIGINS: "*"
    ports:
      - "3000:3000"

volumes:
  airbnb-data:
